name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify watercolor image asset
        run: |
          test -s public/illustrations/skincare101-knowledge-watercolor.jpg
          test "$(head -c 2 public/illustrations/skincare101-knowledge-watercolor.jpg | xxd -p)" = "ffd8"
          test "$(tail -c 2 public/illustrations/skincare101-knowledge-watercolor.jpg | xxd -p)" = "ffd9"
          test "$(wc -c < public/illustrations/skincare101-knowledge-watercolor.jpg)" -gt 5000
          file public/illustrations/skincare101-knowledge-watercolor.jpg | grep -q JPEG
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
