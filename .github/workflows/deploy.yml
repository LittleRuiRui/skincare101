name: Deploy web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expand skin concern questionnaire
        run: node scripts/expand-skin-concerns.mjs
      - name: Verify watercolor image asset
        run: |
          test -s public/illustrations/skincare101-knowledge-watercolor.jpg
          test "$(head -c 2 public/illustrations/skincare101-knowledge-watercolor.jpg | xxd -p)" = "ffd8"
          test "$(tail -c 2 public/illustrations/skincare101-knowledge-watercolor.jpg | xxd -p)" = "ffd9"
          test "$(wc -c < public/illustrations/skincare101-knowledge-watercolor.jpg)" -gt 5000
          file public/illustrations/skincare101-knowledge-watercolor.jpg | grep -q JPEG
      - name: i18n audit
        run: npm run audit:i18n
      - name: Catalog governance audit
        run: npm run audit:catalog
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Enable Niuma share card tools
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/play/niuma/index.html')
          s = p.read_text()
          tag = '<script src="/play/niuma/result-tools.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s)
          PY
      - name: Verify canonical Niuma route
        run: |
          test -s dist/play/niuma/index.html
          grep -q '牛籍鉴定报告' dist/play/niuma/index.html
          grep -q '隐藏人格' dist/play/niuma/index.html
          grep -q '职场天敌' dist/play/niuma/index.html
          grep -q '发给朋友 / 同事看看' dist/play/niuma/index.html
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
