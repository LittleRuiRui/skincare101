name: Deploy web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expand skin concern questionnaire
        run: node scripts/expand-skin-concerns.mjs
      - name: Verify watercolor image asset
        run: |
          test -s public/illustrations/skincare101-knowledge-watercolor.jpg
          test "$(head -c 2 public/illustrations/skincare101-knowledge-watercolor.jpg | xxd -p)" = "ffd8"
          test "$(tail -c 2 public/illustrations/skincare101-knowledge-watercolor.jpg | xxd -p)" = "ffd9"
          test "$(wc -c < public/illustrations/skincare101-knowledge-watercolor.jpg)" -gt 5000
          file public/illustrations/skincare101-knowledge-watercolor.jpg | grep -q JPEG
      - name: i18n audit
        run: npm run audit:i18n
      - name: Catalog governance audit
        run: npm run audit:catalog
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish Niuma v2 on fresh path
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          src = Path('dist/play/niuma')
          dst = Path('dist/play/niuma-v2')
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)

          # Force every built homepage/app link away from the stale legacy route.
          for p in Path('dist').rglob('*'):
              if not p.is_file() or p.suffix not in {'.js', '.html'}:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              ns = s.replace('/play/niuma/', '/play/niuma-v2/')
              if ns != s:
                  p.write_text(ns)
          PY
      - name: Enable Niuma share card tools
        run: |
          python - <<'PY'
          from pathlib import Path
          for route in ('niuma', 'niuma-v2'):
              p = Path(f'dist/play/{route}/index.html')
              s = p.read_text()
              tag = f'<script src="/play/{route}/result-tools.js"></script>'
              if tag not in s:
                  s = s.replace('</body>', tag + '</body>')
                  p.write_text(s)
          PY
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4