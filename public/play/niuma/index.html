ckground:var(--pink)}h2{font-size:clamp(23px,5vw,32px);line-height:1.45}.scene{border:2px solid;border-radius:22px;overflow:hidden;background:#eee2cd;margin:14px 0}.scene img{display:block;width:100%;mix-blend-mode:multiply}.fallback{height:190px;display:grid;place-items:center;font-size:70px;background:linear-gradient(160deg,#d7e7ed,#f3e5ca)}.answers{display:grid;gap:11px}.ans{border:2px solid #2b2622;border-radius:17px;background:#fffdf8;padding:14px;text-align:left;font-size:15.5px;line-height:1.55;font-weight:700;cursor:pointer}.ans:nth-child(4n+1){box-shadow:4px 4px 0 #f4abc1}.ans:nth-child(4n+2){box-shadow:4px 4px 0 #f4d36e}.ans:nth-child(4n+3){box-shadow:4px 4px 0 #b9ddea}.ans:nth-child(4n){box-shadow:4px 4px 0 #cfe0ad}.ans.sel{background:#ffe2ea}.letter{display:inline-grid;place-items:center;width:29px;height:29px;border:2px solid;border-radius:50%;margin-right:8px;background:#fff}.comment{display:none;margin-top:14px;padding:13px;border:2px dashed;border-radius:15px;background:#e7f0d7;font-weight:800}.comment.on{display:block}.next{display:none;margin:15px auto 0}.next.on{display:block}.result{text-align:center}.result h1{font-size:72px;margin:6px}.resultcard{padding:18px;border:2px solid;border-radius:20px;background:#ffe1e9;text-align:left;font-size:18px;line-height:1.7}.resultmeta{margin:10px 0 16px;font-size:13px;color:#6e655b}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}@media(max-width:520px){.home,.quiz,.result{padding:18px}.ans{font-size:14.5px}}</style></head><body><main class="wrap"><section id="home" class="screen on paper home"><div class="stamp">🐮 牛马国际评级委员会 · V2</div><h1>你是哪一种<br><span class="pink">打工牛马？</span></h1><p><span class="tag">12 道离谱但真实的职场现场</span></p><img class="heroimg" src="https://littleruirui.github.io/niuma-personality-test/assets/v2-hero.svg"><p><b>现在真的有 12 种牛马人格。</b></p><button class="btn" onclick="start()">开始检查牛籍 →</button><p class="tiny">peaced. by Rae · Play</p><a class="old" href="/">← 回到 skincare 首页</a></section><section id="quiz" class="screen paper quiz"><div class="top"><span id="num"></span><span>牛马档案 🗂</span></div><div class="bar"><i id="prog"></i></div><h2 id="q"></h2><div id="scene" class="scene"></div><div id="answers" class="answers"></div><div id="comment" class="comment"></div><button id="next" class="btn next" onclick="go()">下一题 →</button></section><section id="result" class="screen paper result"><div class="stamp">鉴定结果</div><h1 id="code"></h1><h2 id="name"></h2><div id="resultcard" class="resultcard"></div><div id="resultmeta" class="resultmeta"></div><img class="types" src="https://littleruirui.github.io/niuma-personality-test/assets/v2-types.svg"><div class="actions"><button class="btn" onclick="start()">再测一次</button><a class="homebtn" href="/?utm_source=niuma&utm_medium=play&utm_campaign=viral_test">精神测完了，回去看看我的皮肤 →</a></div></section></main><script>const TYPES={BULL:['职场紫微星','👑🐮','你看到事情的第一反应通常是：我来。行动快、扛事强，最容易把普通项目做成自己的晋升材料。'],MAMA:['团队妈妈','🧺🐮','你是团队里默认的补位者、安慰者和收尾者。最大的风险不是做不好，而是大家逐渐觉得这些本来就该你做。'],DOGE:['老板爱犬','🕶️🐮','你对老板和组织信号异常敏感，知道什么时候该出现、什么时候该表态，职场雷达常年满格。'],FISH:['摸鱼大师','🐟🐮','你非常清楚公司购买的是工作结果，不是你整个人生。能高效完成的绝不多耗一分钟。'],POOR:['房贷战士','💸🐮','你不是没有辞职冲动，只是现金流管理能力太强。工资到账那一刻，很多人生问题都暂时获得了答案。'],QUIT:['精神离职','🚪🐮','肉体正常参会，灵魂已经更新 LinkedIn。你不是今天才想走，只是一直在等待那个足够合理的出口。'],DEAD:['带薪遗体','🪦🐮','Teams 绿点在线，人类状态离线。你已经把稳定交付训练成一种无需情绪参与的肌肉记忆。'],FAKE:['表面专业','🎭🐮','你的邮件永远礼貌，会议永远点头，真实内心活动全部留在草稿箱和朋友群里。'],MESS:['职场搅屎棍','🍿🐮🔥','你未必主动制造事故，但对荒谬现场有天然观察欲。事情越离谱，你越清醒，偶尔还会忍不住添一点戏剧性。'],BOSS:['野生老板','👔🐮','你天然会思考资源、结果、影响力和谁该负责。哪怕没有管理头衔，也经常不自觉地开始管理现场。'],AIYA:['AI 寄生人','🤖🐮','能自动化的绝不手动，能让模型干的绝不自己熬夜。你最大的职业理想是让 AI 替你把牛做完。'],CHAOS:['事故体质','💥🐮','你的人生不是在处理意外，就是在去处理下一个意外的路上。神奇的是，你往往还真能从混乱里活下来。']};const qs=[["老板凌晨 1:37 发来：“睡了吗？有个小事。”",["立刻坐起来打开电脑。老板半夜还想到我，说明我至少是核心牛马。","看到了，但决定明早 8:59 再回。睡眠暂不接受恶意并购。","先截图发给同事：他也找你了吗？工作可以明天做，情报必须今晚确认。","盯着“小事”三分钟。根据历史数据，小事平均涉及 4 个部门和一个周末。"]],["公司裁员 30%。你活下来了，第二天老板把三个人的工作交给你。",["先接住，至少我还在牌桌上。","问老板：那他们三个的工资有没有一部分也活下来？","把三个空工位拍给同事：原来他们以前是我的防火墙。","打开 Excel 重算时薪，发现自己其实被裁了 75%。"]],["公司发“完全匿名”的员工满意度调查，最后一题：请填写直属经理姓名。",["前面骂了八页，看到这里全部改成 Neutral。","继续填。再问两题就可以直接叫我身份证号。","全部非常满意。今天又成功参与了一次企业民主。","截图发同事问：这个真的匿名吗？"]],["周六“自愿参加” Team Building，邮件最后写 Attendance will be noted。",["报名。既然牺牲周六，至少我要站照片 C 位。","开始寻找一个周五晚上突然出现的远房亲戚。","不去。Attendance 可以 note，本人也会 note 公司占用周末。","主动问 HR：不参加会怎样？我要测试“自愿”的弹性。"]],["老板在会上讲错一个关键数字，而且讲得非常自信。",["直接打断：老板，这个数好像不是这样。","疯狂私聊老板提醒。此刻我是他的场外教练。","不说话，默默翻到数据来源那页，先留证据。","再听五分钟，想看看错误数字能在多少个经理点头下走多远。"]],["老板说：这个项目做好了，对你明年晋升很有帮助。",["好的老板，我来。LinkedIn title 已经在脑内更新。","先问：具体做到什么算做好？把饼换算成 KPI。","脑内自动打开 Excel：加班小时 × 时薪 ÷ 晋升概率。","先问 visibility 高不高。活可以干，但正确的人必须知道。"]],["今年奖金取消，但公司会送大家一份特别礼物。",["第一反应：是不是要裁员？surprise 已自动翻译成风险事件。","先猜礼物值多少钱，低于 S$50 就下调感谢评级。","问 HR：可以不要礼物直接折现吗？","组织同事竞猜礼物是什么，自己创造奖金市场。"]],["你发现 AI 可以完成你 90% 的工作。",["立刻做成 workflow，然后告诉老板最近状态比较好。","推动全组使用，五分钟后已经在画自动化路线图。","保持原交付速度，把省下时间拿去吃饭散步。","同时打开五个模型开会，一个人伪装成小型咨询公司。"]],["同事把老板意思完全理解反了，而且非常自信地开始执行。",["马上提醒。现在不说最后一定会变成我的锅。","私聊：你要不要再确认一下？我已经尽到人类义务。","他说“我很确定”，那我突然也不是很确定了。","再观察五分钟。不是希望出事，主要是发展到这里有点精彩。"]],["你请两周假，前三天公司 0 条消息。",["太好了，终于有人尊重边界。继续睡。","打开邮箱确认自己还在通讯录里。","开始怀疑公司没有我是不是运转得太好了。","打开 LinkedIn 看看自己是不是已经离职。"]],["你已经第 47 次决定辞职。",["更新简历、算存款、打开招聘软件，流程非常成熟。","把辞职信改名 resignation_final_v12_这次真的.docx。","先看工资到账没有，有的话情绪恢复到再看看。","跟同事说最多再待三个月，同事翻出你两年前同款发言。"]],["你中了 S$10 million。第二天 9:03，老板：Hi, are you online?",["Sorry boss, just saw this。财富自由没覆盖条件反射。","已读，把手机扣过去。第一次发现不回复也是资产。","回一句：什么事？主要想听听他还能有什么事。","回：哪位？然后工牌在抽屉里自行失去法律效力。"]]];const MAP=[[['DOGE','DEAD'],['FISH','QUIT'],['MAMA','MESS'],['BOSS','CHAOS']],[['BULL','BOSS'],['POOR','BOSS'],['MESS','CHAOS'],['POOR','QUIT']],[['FAKE','DEAD'],['CHAOS','BOSS'],['DOGE','FAKE'],['MESS','MAMA']],[['DOGE','BULL'],['QUIT','FISH'],['FISH','BOSS'],['BOSS','CHAOS']],[['BULL','BOSS'],['DOGE','MAMA'],['DEAD','FAKE'],['MESS','CHAOS']],[['BULL','DOGE'],['BOSS','POOR'],['POOR','QUIT'],['BOSS','DOGE']],[['CHAOS','DEAD'],['POOR','BOSS'],['FISH','POOR'],['MESS','AIYA']],[['AIYA','FISH'],['AIYA','BOSS'],['FISH','QUIT'],['AIYA','MESS']],[['MAMA','BOSS'],['FAKE','MAMA'],['FISH','QUIT'],['MESS','CHAOS']],[['FISH','QUIT'],['POOR','DEAD'],['DEAD','CHAOS'],['QUIT','FAKE']],[['BULL','QUIT'],['QUIT','FAKE'],['POOR','DEAD'],['MESS','QUIT']],[['DOGE','DEAD'],['FISH','QUIT'],['MESS','BOSS'],['CHAOS','QUIT']]];const comments=['委员会记录：这不是选择题，这是工伤鉴定。','已记录。您的职业人格正在缓慢暴露。','非常合理。合理得让 HR 有一点不安。','收到。证据已存档，请继续作答。'];let i=0,picks=[],score={},lastHit={};function resetScores(){score={};lastHit={};Object.keys(TYPES).forEach(t=>{score[t]=0;lastHit[t]=-1})}function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on');scrollTo(0,0)}function start(){i=0;picks=[];resetScores();show('quiz');render()}function render(){num.textContent=String(i+1).padStart(2,'0')+' / 12';prog.style.width=(i/12*100)+'%';q.textContent=qs[i][0];scene.innerHTML=i===0?'<img src="https://littleruirui.github.io/niuma-personality-test/assets/v2-q1.svg">':'<div class="fallback">'+['🔥🐮🍿','✂️🐮💻','📝🐮👀','🏕️🐮📎','📊🐮😶','🥧🐮📈','🎁🐮💸','🤖🐮☕','🔥🐮🍿','🏖️🐮📵','📄🐮🚪','💰🐮📱'][i]+'</div>';answers.innerHTML='';qs[i][1].forEach((t,j)=>{let b=document.createElement('button');b.className='ans';b.innerHTML='<span class="letter">'+String.fromCharCode(65+j)+'</span>'+t;b.onclick=()=>pick(j,b);answers.appendChild(b)});comment.className='comment';next.className='btn next'}function pick(j,b){if(document.querySelector('.ans.sel'))return;picks.push(j);const pair=MAP[i][j];score[pair[0]]+=2;score[pair[1]]+=1;lastHit[pair[0]]=i;lastHit[pair[1]]=i;document.querySelectorAll('.ans').forEach(x=>x.disabled=true);b.classList.add('sel');comment.textContent='🐮 '+comments[(i+j)%comments.length];comment.className='comment on';next.textContent=i===11?'提交牛籍 →':'下一题 →';next.className='btn next on'}function go(){i++;if(i<12)render();else finish()}function finish(){const ranked=Object.keys(TYPES).sort((a,b)=>score[b]-score[a]||lastHit[b]-lastHit[a]||a.localeCompare(b));const winner=ranked[0],r=TYPES[winner];code.textContent=winner;name.textContent=r[1]+' '+r[0];resultcard.textContent=r[2];resultmeta.textContent='次高倾向：'+TYPES[ranked[1]][0]+' · '+TYPES[ranked[2]][0];show('result');try{const payload={session_id:sessionStorage.getItem('peaced-play-session')||crypto.randomUUID(),event_name:'play_complete',page_name:'play_niuma',language:'zh',metadata:{result:winner,second:ranked[1],third:ranked[2],model:'niuma_v2_12type'}};sessionStorage.setItem('peaced-play-session',payload.session_id);fetch('https://tepiqcwytynhrjhtvnws.supabase.co/rest/v1/analytics_events',{method:'POST',headers:{apikey:'sb_publishable_J9GjGc-hNTEvpl-MTyRAiw__JuISs-T','Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)})}catch(e){}}resetScores();</script></body></html>
