const TYPES={

FISH:{name:'摸鱼大师 · 带薪自由人',punch:'公司买走了你的时间，没有成功捕获你的灵魂。',desc:'活可以干，deadline 可以交，但你拒绝主动把所有剩余生命也一起赠送给公司。',verdict:'时间管理能力优秀，自我保护意识稳定。\n在完成必要产出的同时，有效控制额外生命损耗。\n建议公司不要试图回收全部空闲时间。'},

const HIDDEN={
BULL:{MAMA:'你一路往前冲，真到同事快撑不住的时候，还是会回头把人捞上来。',DOGE:'你能打归能打，也很清楚成果要让正确的人看见。',FISH:'你平时很能打，但对没有意义的活也是真的懒得演。',POOR:'你敢冲机会，前提是 Excel 算完以后现金流还能活。',QUIT:'你不是没想过走，只是每次准备走又刚好来了个值得做的东西。',DEAD:'你偶尔也会彻底没电，只是恢复以后又开始接管现场。',FAKE:'你能力是真的，知道什么时候把锋芒收起来也是真的。',MESS:'你做正事很快，所以偶尔也有余裕围观一下别人怎么把事做炸。',BOSS:'你本来只是想把事情做好，做着做着开始觉得：“这个项目为什么不是我说了算？”',AIYA:'别人还在讨论 AI，你已经拿它把项目往前推了一轮。',CHAOS:'你不是每次都赢，但特别擅长把事故重新讲成机会。'},
MAMA:{BULL:'你本来只是想帮一下，帮着帮着把整个项目带赢了。',DOGE:'你照顾所有人，也不会忘记最需要被照顾的那位关键人物。',FISH:'你嘴上说关我屁事，真看到同事快死了还是会把 PPT 接过来。',POOR:'你照顾团队很认真，但涉及自己的工资和房贷时脑子也异常清醒。',QUIT:'你每天都想走，最后总因为“我走了他们怎么办”又多待了一阵。',DEAD:'自己已经没电了，还在问别人：“你还好吗？”',FAKE:'你很会照顾气氛，有些真实情绪就顺手一起照顾没了。',MESS:'你一边劝大家别吵，一边已经完整掌握了事情的前因后果。',BOSS:'你开始只是帮大家兜底，后来发现自己其实已经在做管理。',AIYA:'你连照顾团队都开始自动化：模板、提醒、总结，一个都不能少。',CHAOS:'你平时负责救火，偶尔也会成为那个让大家突然开始救火的人。'},

const maxScore=Object.fromEntries(P.map(p=>[p,qs.reduce((sum,q)=>sum+Math.max(...q.a.map(a=>a[2][p]||0)),0)]));
let i=0,locked=false,cowDelta=0;const raw=Object.fromEntries(P.map(p=>[p,0])),support=Object.fromEntries(P.map(p=>[p,0])),strong=Object.fromEntries(P.map(p=>[p,0]));const qel=document.getElementById('q'),choices=document.getElementById('choices'),fb=document.getElementById('feedback'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar');
function render(){locked=false;fb.className='feedback';next.className='next';count.textContent=String(i+1).padStart(2,'0')+' / '+qs.length;bar.style.width=(i/qs.length*100)+'%';qel.textContent=qs[i].q;choices.innerHTML='';qs[i].a.forEach((x,n)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span>'+x[0].replaceAll('\n','<br>')+'</span>';b.onclick=()=>choose(b,x);choices.appendChild(b)})}
function choose(b,x){if(locked)return;locked=true;b.classList.add('sel');[...choices.children].forEach(z=>z.disabled=true);Object.entries(x[2]).forEach(([p,s])=>{raw[p]+=s;if(s>=2)support[p]++;if(s>=3)strong[p]++});cowDelta+=x[3];fb.innerHTML='<b>牛马国际评级委员会：</b>'+x[1];fb.classList.add('show');next.classList.add('show');bar.style.width=((i+1)/qs.length*100)+'%'}
next.onclick=()=>{i++;if(i>=qs.length)showResult();else render()};
function eligible(p){if(p==='AIYA')return support[p]>=2;if(['BULL','MESS','CHAOS'].includes(p))return support[p]>=2;return true}
function finalScore(p){return raw[p]/Math.pow(Math.max(1,maxScore[p]),.6)}
function cowLabel(v){if(v<=20)return'反骨突出，建议管理层谨慎接触。';if(v<=40)return'尚有尊严，偶尔低头。';if(v<=60)return'能屈能伸，标准牛马。';if(v<=80)return'窝囊稳定，具备长期就业价值。';return'天选忍人，老板看了很安心。'}
function shareText(win,hidden){const n=NEMESIS[win][0];return'我的牛籍：'+win+' '+TYPES[win].name+'\n隐藏人格：'+hidden+' '+TYPES[hidden].name+'\n职场天敌：'+n+' '+TYPES[n].name+'\n你是哪一种？'}
async function doShare(text){if(navigator.share){try{await navigator.share({title:'我的牛籍鉴定报告',text,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(text+'\n'+location.href);alert('结果已复制，可以去分享了。')}catch(e){prompt('复制下面这段分享：',text+'\n'+location.href)}}
function showResult(){document.getElementById('quiz').style.display='none';const ranked=P.map(p=>({p,s:finalScore(p)})).filter(x=>eligible(x.p)).sort((a,b)=>b.s-a.s||P.indexOf(a.p)-P.indexOf(b.p));const win=(ranked[0]||{p:'FISH'}).p;const hidden=(ranked.find(x=>x.p!==win)||{p:'QUIT'}).p;const t=TYPES[win],ht=TYPES[hidden],n=NEMESIS[win][0],nt=TYPES[n];const total=ranked.reduce((s,x)=>s+Math.max(0,x.s),0)||1;const hiddenPct=Math.round((ranked.find(x=>x.p===hidden)?.s||0)/total*100);const hiddenLabel=hiddenPct>=15?'隐藏人格':'偶发人格';const combo=(HIDDEN[win]&&HIDDEN[win][hidden])||'你平时不是这样，但这个人格会在特定场合突然接管身体。';const c=Math.max(0,Math.min(100,Math.round(50+cowDelta*.5)));const text=shareText(win,hidden);const r=document.getElementById('result');r.classList.add('show');r.innerHTML='<span class="badge">牛籍鉴定报告</span><div class="code">'+win+'</div><div class="subtitle">'+t.name+'</div><div class="punch">'+t.punch+'</div><div class="diag">'+t.desc+'</div><div class="verdict"><b>牛马国际评级委员会鉴定：</b><br>'+t.verdict+'</div><div class="traitbox"><div class="section-kicker">'+hiddenLabel+' · '+hiddenPct+'%</div><div class="trait-title">'+hidden+' · '+ht.name+'</div><div class="trait-copy">'+combo+'</div></div><div class="nemesis"><div class="section-kicker">⚠ 职场天敌</div><div class="nemesis-title">'+n+' · '+nt.name+'</div><div class="nemesis-copy">'+NEMESIS[win][1]+'</div></div><div class="meterbox"><div class="meterhead"><b>窝囊指数</b><span class="score">'+c+' / 100</span></div><div class="meter"><i style="width:'+c+'%"></i></div><div class="cowcopy">'+cowLabel(c)+'</div></div><div class="actions"><button class="secondary primary" id="share">分享我的结果</button><button class="secondary friend" id="friend">发给朋友 / 同事看看</button><button class="secondary" onclick="location.reload()">再测一次</button></div><div class="note">娱乐测试，仅供职场精神状态观察。</div>';document.getElementById('share').onclick=()=>doShare(text);document.getElementById('friend').onclick=()=>doShare('我刚测完牛籍，第一时间想到你。\n'+text+'\n不服的话你自己测。')}
render();
</script></body></html>
