{q:'两个部门突然在大群里吵起来了。',a:[['开始整理时间线。\n吃瓜也要有专业精神。','信息归档能力优秀，动机暂不评价。',{MESS:3,BOSS:1},0],['私聊其中一方：\n“其实有句话，我不知道该不该跟你说……”\n然后说了。','已确认：你对局势稳定的贡献接近于零。',{MESS:4,FAKE:1},-10],['@老板：您要不说两句？\n然后下班了。','责任成功升级，人员成功撤离。',{FISH:4},-10],['“哈哈哈哈他们打起来了。”\n结果发到了公司大群。','事故已发生。你本人仍处于震惊状态。',{CHAOS:4,MESS:1},-20]]},

{q:'会上老板问：“有人了解这个吗？”\n你：“我知道一点。”\n老板：“好，那你负责。”',a:[['立刻补充：“其实王总比我更熟。”\n王总缓缓抬头。','知识共享完成，友情评级待观察。',{FISH:3,MESS:2},-10],['从此开会再也不说话。','成长发生得非常突然。',{DEAD:3,FISH:2},10],['项目黄了，赛道火了。\n简历上：0→1 战略项目负责人。\n后来成功跳槽。','项目生命周期结束，你的职业生命周期刚刚开始。',{BULL:3,FAKE:2},-10],['接了。\n第二天老板离职。\n那就不用做了。','任务状态：自然死亡。',{CHAOS:4,FISH:1},0]]},
{q:'你已经第 47 次决定辞职。现在进行到哪一步？',a:[['打开银行 App。\n等年终奖之后再走。','委员会认定：离职计划受现金流强约束。',{POOR:4,QUIT:2},20],['辞职信写好了。\n定时发送：明天 9:00。\n8:59，取消发送。','辞职完成率 99%，最后 1% 由房贷接管。',{QUIT:4,POOR:2},20],['不辞了。\n决定把公司熬倒。','战略由撤退调整为长期消耗战。',{DEAD:3,BOSS:2},0],['真辞了。\n本来准备休息半年。\n第二周收到一个涨薪 50% 的 offer。','本委员会申请复核你的命格。',{BULL:4,QUIT:1},-20]]},
{q:'你发现 AI 已经能做掉你 90% 的工作。',a:[['主动跟老板汇报：效率提升了 90%。','恭喜，效率提升已被公司成功回收。',{MAMA:3,DEAD:2},20],['开始同时指挥 ChatGPT、Claude、Gemini。\n第一次体会到了当老板的感觉。','组织架构虽未更新，你已拥有地下部门。',{AIYA:4,BOSS:2},-10],['很好。\n工作 30 分钟做完，\n剩下 7.5 小时保持 Teams 绿色。','产出完成，生命体征维持正常。',{FISH:4,FAKE:2},-10],['“那公司还要我干嘛？”\n第一次认真打开公司福利手册，\n看看被裁能赔多少。','风险意识良好，职业安全感进入观察名单。',{POOR:3,QUIT:2},10]]},
{q:'忙完一个大项目，老板只说了一句：“辛苦了。”',a:[['“辛苦费什么时候发？”\n突然发现群里安静了。','问题非常合理，场面暂时不太合理。',{BOSS:3,CHAOS:2},-20],['“不辛苦。”\n说完突然反应过来：\n不对，我挺辛苦的。','自我感受延迟到账。',{MAMA:3,DEAD:2},10],['“老板您更辛苦。”\n老板：“还是你懂我。”\n年底你升职了。\n同事开始重新审视这句话。','向上管理评级上调，同事正在重新研究这句话。',{DOGE:4,BULL:2},20]]},
{q:'你已经准备下班了，老板突然说：“大家先别走，有个小事。”',a:[['“没问题。”\n终于加完班打开打车软件。\n价格飙升，前方排队 100 人。\n第一次对公司产生了具体的恨。','对公司的恨终于获得了具体价格。',{POOR:3,DEAD:2},20],['老板讲了十分钟。\n你想了半天晚上吃啥。\n散会后把录音发给 AI：\n“总结一下，他到底要什么？”','信息处理方式先进，注意力去向不明。',{AIYA:3,FISH:2},-10],['本来已经准备摆脸色了。\n老板：“今天加班的，明天上午可以晚点来。”\n你的脸当场恢复了企业文化。','补偿机制有效，企业文化已快速修复。',{DOGE:3,MAMA:2},10]]},
{q:'你偷偷约了一个面试，结果和老板临时叫你的会撞了。',a:[['把面试改期了。\n对方 HR：“下周可以吗？”\n“可以。”\n老板并不知道自己刚刚成功续约了一名员工。','公司留才机制在毫不知情的情况下成功运转。',{POOR:3,DOGE:2},20],['两个都参加。\n公司会议开着麦，面试开着摄像头。\n职业生涯第一次实现真正的 multitasking。','职业生涯首次实现真正的 multitasking。',{AIYA:3,CHAOS:3},-10],['说自己不舒服，想请假。\n老板：“没事，你去。”\n诚实只需要省略一点细节。\n实际上确实不舒服——对现在这份工作不舒服。','症状属实，病因暂不便向老板披露。',{FAKE:3,QUIT:2},-10]]},
{q:'公司突然通知：从明天开始，你可以自己选老板。',a:[['“可以不选吗？”','制度给了选择，你选择退出选择。',{FISH:3,QUIT:2},-10],['开始研究每个老板过去三年的晋升记录。\n跟谁不重要，谁能带我升职比较重要。','决策高度理性，情感因素已剔除。',{DOGE:4,BOSS:1},10],['选了全公司公认最难搞的那个。\n因为他手上有最好的项目。','风险偏好上调，收益目标同步上调。',{BULL:3,BOSS:2},-20],['“那我能选自己吗？”','问题已超出 HR 原始设计范围。',{BOSS:4},-40]]},
{q:'你中了 1000 万。第二天早上，老板问：“在线吗？”',a:[['“在的老板，什么事？”\n发完三秒后突然坐直：\n等一下，我不是有 1000 万了吗？','财富已经自由，牛马系统仍在后台运行。',{DOGE:3,DEAD:1},30],['“在，但以后不一定了。”\n然后认真把手上的工作交接完。\n第一次下班，不需要看老板脸色。','经委员会确认：该牛马已具备放归自然条件。',{QUIT:3,MAMA:2},-20],['没回。\n因为你正在去机场的路上。\n老板：“人呢？”\n“人在奔向美好生活。”','恭喜，该员工已成功从公司资产转为自然人。',{BULL:3,QUIT:2},-40],['“在。正好我也有件事想跟你聊。”\n半小时后，\n你从员工变成了公司潜在投资人。','有些牛马获得自由后，第一反应是自己开牧场。',{BOSS:4,BULL:2},-50]]}
];
const BASELINE=Object.fromEntries(P.map(p=>{let mu=0,v=0;qs.forEach(q=>{const xs=q.a.map(a=>a[2][p]||0),m=xs.reduce((s,x)=>s+x,0)/xs.length;mu+=m;v+=xs.reduce((s,x)=>s+(x-m)*(x-m),0)/xs.length});return[p,{mu,sd:Math.sqrt(v)||1}]}));
let i=0,locked=false,cowDelta=0;const raw=Object.fromEntries(P.map(p=>[p,0])),support=Object.fromEntries(P.map(p=>[p,0])),strong=Object.fromEntries(P.map(p=>[p,0]));const qel=document.getElementById('q'),choices=document.getElementById('choices'),fb=document.getElementById('feedback'),next=document.getElementById('next'),count=document.getElementById('count'),bar=document.getElementById('bar'),questionImage=document.getElementById('questionImage');
document.getElementById('start').onclick=()=>{document.getElementById('cover').classList.add('hidden');document.getElementById('quiz').classList.add('show');render()};
function render(){locked=false;fb.className='feedback';next.className='next';count.textContent=String(i+1).padStart(2,'0')+' / '+qs.length;bar.style.width=(i/qs.length*100)+'%';questionImage.src='images/question-'+String(i+1).padStart(2,'0')+'.jpg';questionImage.alt='第 '+(i+1)+' 题职场情景插画';questionImage.fetchPriority=i===0?'high':'auto';qel.textContent=qs[i].q;choices.innerHTML='';qs[i].a.forEach((x,n)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span>'+x[0].replaceAll('\n','<br>')+'</span>';b.onclick=()=>choose(b,x);choices.appendChild(b)})}
function choose(b,x){if(locked)return;locked=true;b.classList.add('sel');[...choices.children].forEach(z=>z.disabled=true);Object.entries(x[2]).forEach(([p,s])=>{raw[p]+=s;if(s>=2)support[p]++;if(s>=3)strong[p]++});cowDelta+=x[3];fb.innerHTML='<b>牛马国际评级委员会：</b>'+x[1];fb.classList.add('show');next.classList.add('show');bar.style.width=((i+1)/qs.length*100)+'%'}
next.onclick=()=>{i++;if(i>=qs.length)showResult();else render()};
function eligible(p){if(p==='AIYA')return support[p]>=2&&strong[p]>=1;if(['BULL','MESS','CHAOS'].includes(p))return support[p]>=2;return true}
function finalScore(p){return(raw[p]-BASELINE[p].mu)/BASELINE[p].sd}
function cowLabel(v){if(v<=20)return'反骨突出，建议管理层谨慎接触。';if(v<=40)return'尚有尊严，偶尔低头。';if(v<=60)return'能屈能伸，标准牛马。';if(v<=80)return'窝囊稳定，具备长期就业价值。';return'天选忍人，老板看了很安心。'}
function cowArt(v){if(v<=20)return['result-wonang-00-20.jpg','反骨突出职场情景插画'];if(v<=40)return['result-wonang-21-40.jpg','尚有尊严职场情景插画'];if(v<=60)return['result-wonang-41-60.jpg','标准牛马职场情景插画'];if(v<=80)return['result-wonang-61-80.jpg','窝囊稳定职场情景插画'];return['result-wonang-81-100.jpg','天选忍人职场情景插画']}
function secondaryStrength(win,hidden,ranked){const a=ranked.find(x=>x.p===win)?.s??0,b=ranked.find(x=>x.p===hidden)?.s??0;const shiftedA=Math.max(0,a+2),shiftedB=Math.max(0,b+2);return Math.round(shiftedB/Math.max(.001,shiftedA+shiftedB)*100)}
function comboCopy(win,hidden){return'主人格负责当 '+TYPES[win].name.split(' · ')[0]+'，隐藏人格负责偷偷加戏。\n'+COMBO_TAIL[hidden]}
function shareText(win,hidden){return'我测出来是 '+win+'｜'+TYPES[win].name+'\n隐藏人格：'+hidden+'｜'+TYPES[hidden].name+'\n\n你是牛来，还是牛马？'}
async function doShare(text){if(navigator.share){try{await navigator.share({title:'你是牛来，还是牛马？',text,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(text+'\n'+location.href);alert('结果已复制，可以发给同事了。')}catch(e){prompt('复制下面这段分享：',text+'\n'+location.href)}}
function showResult(){document.getElementById('quiz').style.display='none';const ranked=P.map(p=>({p,s:finalScore(p)})).filter(x=>eligible(x.p)).sort((a,b)=>b.s-a.s||P.indexOf(a.p)-P.indexOf(b.p));const win=(ranked[0]||{p:'FISH'}).p,hidden=(ranked.find(x=>x.p!==win)||{p:'QUIT'}).p,t=TYPES[win],ht=TYPES[hidden],n=NEMESIS[win][0],nt=TYPES[n];const hiddenPct=secondaryStrength(win,hidden,ranked),hiddenLabel=hiddenPct>=15?'隐藏人格':'偶现人格';const c=Math.max(0,Math.min(100,Math.round(50+cowDelta*.5))),text=shareText(win,hidden),art=cowArt(c);const r=document.getElementById('result');r.classList.add('show');r.innerHTML='<span class="badge">牛籍鉴定报告</span><div class="youare">你是</div><div class="code">'+win+'</div><div class="subtitle">'+t.name+'</div><div class="punch">'+t.punch+'</div><div class="diag">'+t.desc+'</div><div class="verdict"><b>牛马国际评级委员会鉴定：</b><br>'+t.verdict+'</div><div class="traitbox"><div class="section-kicker">'+hiddenLabel+' · '+hiddenPct+'%</div><div class="trait-title">'+hidden+' · '+ht.name+'</div><div class="trait-copy">'+HIDDEN_COPY[hidden]+'</div></div><div class="combo"><div class="section-kicker">双人格联合会诊</div><div class="combo-title">牛委会联合鉴定</div><div class="combo-copy">'+comboCopy(win,hidden)+'</div></div><div class="nemesis"><div class="section-kicker">职场天敌</div><div class="nemesis-title">'+n+' · '+nt.name+'</div><div class="nemesis-copy">'+NEMESIS[win][1]+'</div></div><div class="meterbox"><figure class="wonang-art"><img src="images/'+art[0]+'" alt="'+art[1]+'" width="1254" height="1254" loading="eager"></figure><div class="meterhead"><b>窝囊指数</b><span class="score">'+c+' / 100</span></div><div class="meter"><i style="width:'+c+'%"></i></div><div class="cowcopy">'+cowLabel(c)+'</div></div><div class="sharebox"><div class="section-kicker">转发给同事进行物种鉴定</div><div class="share-title">你是牛来，还是牛马？</div><div class="share-copy">发给朋友同事，看看他们是哪一种。</div><div class="actions"><button class="secondary primary" id="share">分享我的牛籍</button><button class="secondary friend" id="friend">发给朋友 / 同事看看</button></div></div><div class="skinbox"><div class="section-kicker">PEACEDSKIN · 下一项人格鉴定</div><div class="skin-title">职场人格测完了，要不要看看你的脸是什么人格？</div><div class="skin-copy">知道自己是哪种牛了，再看看自己是什么样的脸皮。</div><div class="actions"><a class="secondary skin" href="/">测测我的皮肤人格 →</a><button class="secondary" onclick="location.reload()">重新检测牛籍</button></div></div><div class="note">娱乐测试，仅供职场精神状态观察。</div>';document.getElementById('share').onclick=()=>doShare(text);document.getElementById('friend').onclick=()=>doShare('我刚测完牛籍，第一时间想到你。\n'+text+'\n不服的话你自己测。')}
</script><script src="result-tools.js"></script></body></html>
