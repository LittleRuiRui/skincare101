<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff7e8" />
<title>牛籍鉴定｜测测你是牛来，还是牛马？</title>
<style>
:root{--paper:#fff7e8;--ink:#251f1a;--pink:#f3a7bd;--yellow:#ffd66f;--blue:#cfe8f5;--green:#dcecc9;--cream:#fffdf7;--muted:#786f65;--line:#251f1a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background-image:radial-gradient(rgba(50,35,20,.055) .7px,transparent .7px);background-size:7px 7px}
main{width:min(760px,94vw);margin:0 auto;padding:20px 0 50px}.card{background:var(--cream);border:2.5px solid var(--line);border-radius:28px;box-shadow:7px 8px 0 rgba(37,31,26,.10);padding:22px}.hide{display:none!important}
.kicker{font-size:12px;font-weight:900;letter-spacing:.1em;color:#9d5570}.heroTitle{font-size:clamp(38px,9vw,64px);font-weight:1000;line-height:1.08;margin:10px 0 12px}.heroSub{font-size:20px;font-weight:900;line-height:1.55}.heroNote{font-size:14px;color:var(--muted);line-height:1.7;margin-top:10px}.stamp{display:inline-block;margin-top:16px;padding:7px 11px;border:2px solid var(--ink);border-radius:12px;background:var(--yellow);font-weight:900;transform:rotate(-2deg)}
.start,.next,.action{border:2px solid var(--ink);border-radius:16px;font-weight:900;cursor:pointer;color:var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.08)}.start{width:100%;margin-top:20px;padding:14px;background:var(--pink);font-size:17px}.top{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:900}.progress{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:12px 0 22px;background:#fff}.progress i{height:100%;display:block;background:var(--pink);width:0;transition:.25s}.q{font-size:clamp(23px,5.6vw,32px);font-weight:1000;line-height:1.45;white-space:pre-line;margin-bottom:17px}.choices{display:grid;gap:11px}.choice{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;width:100%;border:2px solid var(--ink);border-radius:17px;background:#fff;padding:13px 14px;text-align:left;font-size:15px;line-height:1.65;font-weight:750;cursor:pointer}.letter{width:31px;height:31px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:1000;background:#ffe3ec}.choice:nth-child(2) .letter{background:#ffe8a7}.choice:nth-child(3) .letter{background:var(--blue)}.choice:nth-child(4) .letter{background:var(--green)}.choice.sel{background:#fff0f5;transform:translateX(2px)}.feedback{display:none;margin-top:14px;border:2px dashed var(--ink);border-radius:18px;background:#f8efd1;padding:13px 14px;line-height:1.65;font-weight:800}.feedback.show{display:block}.next{display:none;margin:14px auto 0;padding:11px 18px;background:var(--yellow)}.next.show{display:block}
.badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:11px;padding:6px 10px;font-weight:1000}.code{font-size:clamp(58px,16vw,96px);font-weight:1000;color:#ef83a5;line-height:1;margin:14px 0 2px;text-shadow:2px 2px 0 var(--ink)}.name{font-size:28px;font-weight:1000;line-height:1.35}.punch{background:#ffdce7;border:2px solid var(--ink);border-radius:18px;padding:16px;font-size:19px;font-weight:1000;line-height:1.6;margin:16px 0}.desc{font-size:15px;line-height:1.9;font-weight:650}.box{margin-top:18px;border:2px solid var(--ink);border-radius:18px;padding:15px;background:#fff}.box.green{background:#eef6e6}.box.pink{background:#fff0f5}.eyebrow{font-size:11px;letter-spacing:.09em;font-weight:900;color:var(--muted);margin-bottom:6px}.boxTitle{font-size:20px;font-weight:1000;margin-bottom:7px}.boxCopy{font-size:14px;line-height:1.75;font-weight:750}.meter{height:18px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));width:0}.meterHead{display:flex;justify-content:space-between;align-items:end}.score{font-size:34px;font-weight:1000}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.action{padding:12px;background:#fff}.action.primary{background:var(--yellow)}.action.friend{background:#ffdce7}.foot{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}@media(max-width:520px){.card{padding:16px}.actions{grid-template-columns:1fr}.choice{font-size:14px}}
</style>
</head>
<body>
<main>
<section class="card" id="landing">
  <div class="kicker">2026 职场十二牲肖 · 牛籍鉴定</div>
  <div class="heroTitle">测测你是牛来，<br>还是牛马？</div>
  <div class="heroSub">12 道离谱但真实的职场题。<br>委员会将鉴定你的主牛籍、隐藏人格和职场天敌。</div>
  <div class="heroNote">本测试不判断你“好不好”，只判断你在办公室里到底是哪一种生物。</div>
  <div class="stamp">牛马国际评级委员会</div>
  <button class="start" id="start">开始鉴定我的牛籍 →</button>
</section>

<section class="card hide" id="quiz">
  <div class="top"><span id="count">01 / 12</span><span>正在采集职场证据</span></div>
  <div class="progress"><i id="bar"></i></div>
  <div class="q" id="q"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="next">下一题 →</button>
</section>

<section class="card hide" id="result"></section>
</main>
<script>
const TYPES={
BULL:{name:'牛来 · 职场紫微星',punch:'能力有，命也有。最气人的是两样经常一起有。',desc:'你不是单纯爱卷。很多时候你是真的觉得“这个我能搞定”，然后也确实能搞定。关键节点还经常刚好有人、机会或者风口把你往上送。'},
MAMA:{name:'牛妈 · 团队妈妈',punch:'公司没给你管理岗，但你已经养了半个部门。',desc:'别人忘 deadline，你记得；新人不会，你教；项目炸了，你补。最离谱的是，这些通常没有写进你的 JD。'},
DOGE:{name:'老板爱犬 · 天选老板缘',punch:'别人研究业务，你顺便研究老板。更气人的是，两边你都研究明白了。',desc:'你不是无脑舔。你只是很快就能判断谁真正有决定权、TA在乎什么、什么时候该说什么。'},
FISH:{name:'摸鱼大师 · 带薪自由人',punch:'公司买走了你的时间，没有成功捕获你的灵魂。',desc:'活可以干，deadline 可以交，但你拒绝把全部剩余生命也一起赠送给公司。'},
POOR:{name:'贫困牛 · 房贷战略合作伙伴',punch:'不是忠诚，是房贷。',desc:'你非常成熟地理解现金流、保险、房贷以及月底工资到账的重要意义。'},
QUIT:{name:'辞职人 · 脑内离职专家',punch:'今天也辞职了。明天记得打卡。',desc:'你的精神已经多次成功离职，只是肉身仍然因为现实原因保持劳动关系。'},
DEAD:{name:'工位遗体 · Teams 在线生命体',punch:'生命体征以 Teams 绿点为准。',desc:'你已经不想参与这个世界，但该交的东西基本还是交了。这不是摆烂，是职业素养支持下的极低功耗运行。'},
FAKE:{name:'职场伪人 · 表面 Professional',punch:'“好的老板😊”是你最成功的人格面具。',desc:'邮件礼貌，表情稳定，会议点头。真正的弹幕从未停止，只是没有发送。'},
MESS:{name:'拱火大师 · 办公室局势观察员',punch:'明明一句话可以阻止事故，但你决定再观察五分钟。',desc:'你未必制造八卦，但八卦出现的时候，你的信息处理能力会突然达到职业生涯巅峰。'},
BOSS:{name:'野生老板 · 在职创业型人格',punch:'上班最大的痛苦，是老板不是我。',desc:'你真正难受的是：为什么这么明显的问题还没人改？为什么资源这样分？为什么这个决定不是我做？'},
AIYA:{name:'赛博牛马 · AI 地下部门负责人',punch:'公司以为你是一个员工，其实你是一个小型咨询公司。',desc:'你真正的特点不是“会用 ChatGPT”，而是会不断想：这件事能不能自动化？能不能拆？能不能让模型先干？'},
CHAOS:{name:'事故圣体 · 职场自然灾害',punch:'你没有主动搞事，但事情总喜欢挑你在的时候发生。',desc:'别人出差见客户，你出差客户换 CEO；别人接项目正常交付，你接项目组织架构突然调整。委员会暂未找到直接因果关系。'}
};
const NEMESIS={
BULL:['DEAD','你每一次“我有个新想法”，都可能是 TA 的一次工伤。'],MAMA:['CHAOS','你负责收拾残局，TA 负责让“残局”这个行业永远有需求。'],DOGE:['BOSS','你想成为老板最信任的人；TA 想成为老板。'],FISH:['DOGE','你在想怎么少干一点，TA 在告诉老板：“我们应该还能再接一个。”'],POOR:['QUIT','TA 负责问“为什么不辞职”，你负责回答“因为数学”。'],QUIT:['POOR','每次你准备自由，TA 都会拿房贷把你拽回现实。'],DEAD:['BULL','你只想安静活到下班，TA 突然说：“我有一个新想法。”'],FAKE:['MESS','你努力维持体面，TA 最大的兴趣就是看体面什么时候裂开。'],MESS:['MAMA','你刚觉得剧情终于精彩了，TA 出来主持大局。'],BOSS:['CHAOS','你想控制变量，TA 本人就是一个无法控制的变量。'],AIYA:['BOSS','你刚证明 AI 可以省三小时，TA 已经开始计算 headcount。'],CHAOS:['MAMA','TA 看到你出现的时候，已经条件反射开始准备收拾残局。']};
const HIDDEN={
'FISH|QUIT':'你表面在摸鱼，心里其实已经离职很多次。','FISH|DOGE':'你平时能少干就少干，但老板突然点名的时候，尾巴还是会条件反射地摇一下。','FISH|BULL':'你看起来没什么事业心，直到某件事真的让你觉得“这玩意儿我能做得更好”。','POOR|QUIT':'每个月都想辞职。每个月工资到账以后，又觉得公司其实也不是完全没有优点。','DOGE|FAKE':'老板以为你忠诚。其实你只是很会在正确的人面前表现得忠诚。','MAMA|DEAD':'自己已经没电了，还在问别人：“你还好吗？”','BULL|CHAOS':'你不是每次都赢，但你特别擅长把事故讲成机会。','DEAD|BULL':'灵魂已经离职，偶尔脑子里还是会冒出一句：“其实这个项目我有个想法。”','BOSS|AIYA':'你不只是想用 AI 提效，你已经开始偷偷重画公司的流程图。','AIYA|FISH':'你用 AI 的最高理想不是升职，而是把重复工作压缩到十分钟然后下线。','FAKE|QUIT':'嘴上“收到谢谢”，心里“这破班谁爱上谁上”。','MESS|FAKE':'你看起来最体面的时候，通常也是内心弹幕最密集的时候。'};
const Q=[
{q:'凌晨 1:37，老板突然发来一句：\n“明早给我一个想法。”',a:[['A','先判断这件事值不值得认真做。值得就开干。',{BOSS:3,FISH:2}],['B','先回一句“收到”，再想老板究竟想看什么。',{DOGE:3,MAMA:2}],['C','看到了，但决定明天早上再成为一个有责任心的人。',{FISH:4,MESS:1}],['D','脑子已经自动开始搭框架，顺手把问题定义都改了。',{BULL:3,MAMA:2,BOSS:2}]]},
{q:'公司宣布：今年没有年终奖。\n你的第一反应？',a:[['A','行，那我也没有额外热情。',{FISH:4}],['B','先观察老板自己是什么反应。',{DOGE:3,MAMA:2}],['C','这公司商业模式是不是哪里有问题？',{BOSS:3,MESS:2}],['D','算了，先把手上的事做好，机会总会来。',{BULL:4}]]},
{q:'两个部门在会议上吵起来了。\n你坐在中间。',a:[['A','先不说话，看看谁先把底牌掀出来。',{MESS:3,BOSS:1}],['B','有点精彩，再观察五分钟。',{MESS:4,FAKE:1}],['C','跟我没关系的话，我希望会议尽快结束。',{FISH:4}],['D','本来只是普通同步会，为什么我一来就变事故现场？',{CHAOS:4,MESS:1}]]},
{q:'新同事第一天问你：\n“这家公司怎么样？”',a:[['A','先把真实情况和生存攻略都讲给 TA。',{MAMA:4}],['B','从组织权力结构开始给 TA 讲。',{MESS:3,BOSS:1}],['C','微笑：“整体还是很不错的。”',{FAKE:3,MESS:2}],['D','主要看你有没有贷款。',{POOR:4}]]},
{q:'老板说：\n“这个项目你比较懂，要不你来 own？”',a:[['A','第一反应：我为什么要懂。',{FISH:3,MESS:2}],['B','可以，但请允许我低功耗运行。',{DEAD:3,FISH:2}],['C','其实我已经想好怎么改了。',{BULL:3,FAKE:2}],['D','上一个 owner 刚走，这项目是不是有点不吉利。',{CHAOS:4,FISH:1}]]},
{q:'这是你第 47 次想辞职。\n为什么还没走？',a:[['A','现金流不允许我拥有那么完整的人格。',{POOR:4,QUIT:2}],['B','精神上已经走了很多次。',{QUIT:4,POOR:2}],['C','主要是懒得重新面试。',{DEAD:3,BOSS:2}],['D','再等等，我觉得下一波机会可能快到了。',{BULL:4,QUIT:1}]]},
{q:'你发现 AI 已经能做你 90% 的重复工作。',a:[['A','太好了，以后终于能帮别人更多。',{MAMA:3,DEAD:2}],['B','立刻开始想整个 workflow 能不能重做。',{AIYA:3,BOSS:2}],['C','太好了，我的人生成功赎回一小时。',{FISH:4,FAKE:1,AIYA:1}],['D','很好，但请不要让老板知道得太详细。',{POOR:3,QUIT:2}]]},
{q:'你做完一个很大的项目，老板只说：\n“辛苦了。”',a:[['A','我开始思考这项目是不是资源配置得有问题。',{BOSS:3,CHAOS:2}],['B','没事，大家平安交付就好。',{MAMA:3,DEAD:2}],['C','好的，最好下一次升职的时候也记得。',{DOGE:4,BULL:2}]]},
{q:'你已经收拾东西准备下班，老板说：\n“还有个小事。”',a:[['A','我脑内开始计算这个“小事”的时薪。',{POOR:3,DEAD:2}],['B','先看能不能 AI 五分钟解决。',{AIYA:3,FISH:2,BOSS:1}],['C','微笑回头：“当然可以。”',{DOGE:3,MAMA:2}]]},
{q:'一个很想去的面试，刚好撞上老板的重要会议。',a:[['A','先算风险：现在这份工资还能不能丢。',{POOR:3,DOGE:2}],['B','想办法把两边流程都重新安排掉。',{AIYA:2,CHAOS:3,BOSS:1}],['C','会议照开，面试照面，表面不能乱。',{FAKE:3,QUIT:2}]]},
{q:'如果可以自己选老板，你会选？',a:[['A','最好别管太细，给我自由。',{FISH:3,QUIT:2}],['B','聪明、靠谱、愿意带我，而且最好喜欢我。',{DOGE:4,BOSS:1}],['C','强，但真的能让我学到东西。',{BULL:3,BOSS:2}],['D','为什么一定要选老板？',{BOSS:4}]]},
{q:'你突然中了 1000 万。第二天老板问：\n“今天在线吗？”',a:[['A','先礼貌回一下，做人留一线。',{DOGE:3,DEAD:1}],['B','在线，但我的灵魂已经办理离职。',{QUIT:3,MAMA:2}],['C','先把手上事情交接漂亮再走。',{BULL:3,QUIT:2}],['D','我不走。我回来收购这个部门。',{BOSS:4,BULL:2}]]}
];
const keys=Object.keys(TYPES);let raw={},support={},idx=0,chosen=false;keys.forEach(k=>{raw[k]=0;support[k]=0});
const maxScore=Object.fromEntries(keys.map(k=>[k,Q.reduce((s,q)=>s+Math.max(...q.a.map(x=>x[2][k]||0)),0)]));
const $=id=>document.getElementById(id);$('start').onclick=()=>{$('landing').classList.add('hide');$('quiz').classList.remove('hide');render()};
function render(){chosen=false;$('next').classList.remove('show');$('feedback').classList.remove('show');$('count').textContent=String(idx+1).padStart(2,'0')+' / '+Q.length;$('bar').style.width=((idx)/Q.length*100)+'%';$('q').textContent=Q[idx].q;$('choices').innerHTML='';Q[idx].a.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="letter">'+o[0]+'</span><span>'+o[1]+'</span>';b.onclick=()=>pick(b,o);$('choices').appendChild(b)})}
function pick(btn,o){if(chosen)return;chosen=true;[...document.querySelectorAll('.choice')].forEach(x=>x.disabled=true);btn.classList.add('sel');for(const[k,v]of Object.entries(o[2])){raw[k]+=v;if(v>=2)support[k]++}let strongest=Object.entries(o[2]).sort((a,b)=>b[1]-a[1])[0]?.[0];$('feedback').innerHTML='<b>委员会记录：</b>'+feedback(strongest);$('feedback').classList.add('show');$('next').classList.add('show')}
function feedback(k){const m={BULL:'你对事情的第一反应不是逃，是“我能不能把它搞定”。',MAMA:'你又在替组织承担一些没人正式交给你的责任。',DOGE:'你对“谁真正有决定权”这件事非常敏感。',FISH:'你的核心 KPI 之一，是保护自己的剩余生命。',POOR:'你非常尊重现金流，这是成熟，不是怂。',QUIT:'你的肉身和精神劳动关系并不完全一致。',DEAD:'检测到低功耗但仍可交付的生命体。',FAKE:'公开表达与真实弹幕之间存在明显价差。',MESS:'你对组织剧情的兴趣高于平均水平。',BOSS:'普通人看到任务，你开始看到系统问题。',AIYA:'你看到重复劳动时，会本能地寻找杠杆。',CHAOS:'委员会再次记录到你周边的异常波动率。'};return m[k]||'已记录新的职场证据。'}
$('next').onclick=()=>{idx++;if(idx<Q.length)render();else showResult()};
function eligible(k){if(['AIYA','BULL','MESS','CHAOS'].includes(k))return support[k]>=2;return true}
function score(k){return raw[k]/Math.pow(Math.max(1,maxScore[k]),.6)}
function showResult(){const ranked=keys.filter(eligible).map(k=>({k,s:score(k)})).sort((a,b)=>b.s-a.s);const primary=ranked[0].k,secondary=ranked[1]?.k||keys.find(k=>k!==primary);const total=ranked.reduce((s,x)=>s+x.s,0)||1;const hiddenPct=Math.round((ranked.find(x=>x.k===secondary)?.s||0)/total*100);const hiddenLabel=hiddenPct>=15?'隐藏人格':'偶发人格';const n=NEMESIS[primary];const wo=Math.max(8,Math.min(96,Math.round(32+(raw.POOR+raw.DEAD+raw.QUIT)*3-(raw.BOSS+raw.BULL)*1.4)));const hiddenCopy=HIDDEN[primary+'|'+secondary]||('你平时主要表现为“'+TYPES[primary].name+'”，但在特定场景下会突然切到“'+TYPES[secondary].name+'”。');$('quiz').classList.add('hide');const r=$('result');r.classList.remove('hide');r.innerHTML=`<span class="badge">牛籍鉴定报告</span><div class="code">${primary}</div><div class="name">${TYPES[primary].name}</div><div class="punch">${TYPES[primary].punch}</div><div class="desc">${TYPES[primary].desc}</div><div class="box green"><div class="eyebrow">${hiddenLabel} · ${hiddenPct}%</div><div class="boxTitle">${TYPES[secondary].name}</div><div class="boxCopy">${hiddenCopy}</div></div><div class="box pink"><div class="eyebrow">职场天敌</div><div class="boxTitle">${TYPES[n[0]].name}</div><div class="boxCopy">${n[1]}</div></div><div class="box"><div class="meterHead"><div><div class="eyebrow">窝囊指数</div><div class="boxCopy">委员会根据你对工资、老板、离职和加班的综合反应估算。</div></div><div class="score">${wo}</div></div><div class="meter"><i style="width:${wo}%"></i></div></div><div class="actions"><button class="action primary" id="share">分享我的结果</button><button class="action friend" id="friend">发给朋友 / 同事看看</button><button class="action" id="again">再测一次</button></div><div class="foot">测试结果仅供娱乐。委员会不承担由此引发的辞职、拱火、老板误会或同事绝交责任。</div>`;$('share').onclick=()=>shareText(`我的牛籍：${TYPES[primary].name}\n${hiddenLabel}：${TYPES[secondary].name}\n职场天敌：${TYPES[n[0]].name}\n你是哪一种？`);$('friend').onclick=()=>shareText(`我刚测完牛籍，第一时间想到你。\n我的结果：${TYPES[primary].name}\n职场天敌：${TYPES[n[0]].name}\n不服的话你自己测。`);$('again').onclick=()=>location.reload();window.scrollTo({top:0,behavior:'smooth'})}
async function shareText(text){const url=location.href;try{if(navigator.share){await navigator.share({title:'牛籍鉴定',text,url});return}await navigator.clipboard.writeText(text+'\n'+url);alert('结果和链接已复制')}catch(e){try{await navigator.clipboard.writeText(text+'\n'+url);alert('结果和链接已复制')}catch(_){prompt('复制下面这段：',text+'\n'+url)}}}
</script>
</body></html>
